<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cyan/Blue Glow Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="line-h-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="line-v-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Red Diagnostic Error Gradient -->
    <radialGradient id="error-dot" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="url(#bg-grad)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104" fill="none" stroke="url(#border-grad)" stroke-width="3"/>

  <!-- Subtle Inner Grid / Crosshair Grid Lines -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6"/>
  </g>

  <!-- Reticle Crosshair Lines -->
  <!-- Horizontal Axis -->
  <line x1="106" y1="256" x2="232" y2="256" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="280" y1="256" x2="406" y2="256" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Vertical Axis -->
  <line x1="256" y1="130" x2="256" y2="232" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="256" y2="382" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>

  <!-- Code Chevron Left: < -->
  <path d="M 230 180 L 166 256 L 230 332" 
        fill="none" 
        stroke="url(#cyan-glow)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>

  <!-- Code Chevron Right: > -->
  <path d="M 282 180 L 346 256 L 282 332" 
        fill="none" 
        stroke="url(#cyan-glow)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neon-glow)"/>

  <!-- Central Red Diagnostic Error Dot (Pinpoint Citation) -->
  <circle cx="256" cy="256" r="14" fill="url(#error-dot)" filter="url(#dot-glow)"/>
</svg>
